# Generated from source.yaml by scripts/generate.py; do not edit.
mode: rule
dns:
  enable: true
  ipv6: true
  use-hosts: true
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - geosite:private
  - geosite:connectivity-check
  - time.*.com
  - ntp.*.com
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  fallback:
  - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
  nameserver-policy:
    rule-set:direct (Domain): https://dns.alidns.com/dns-query
    rule-set:SteamDownload (Domain): https://dns.alidns.com/dns-query
    geosite:cn,private,apple: https://dns.alidns.com/dns-query
    geosite:!cn,gfw: https://posvdm.cloudflare-gateway.com/dns-query
hosts:
  iosapps.itunes.apple.com: hls.itunes.apple.com.mwcname.com
