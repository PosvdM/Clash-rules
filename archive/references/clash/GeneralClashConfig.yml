# 自定义字体
#cfw-font-family: "Noto Sans TC"   # 已安装的字体

# 自定义请求头
#cfw-http-headers:
  #token: "123456"
  #cfw-version: "0.9.11"

# 自定义节点排序
# default：配置顺序；latency：延迟升序；alphabet：名称字母顺序。
cfw-proxies-order: default

