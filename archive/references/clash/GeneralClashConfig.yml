# 1. 原模板的 Clash DNS 请求说明：
#   (1) 并发请求 nameserver 与 fallback 中的所有服务器。
#   (2) 选择 nameserver 中最快返回的结果。
#   (3) 若结果为国外 IP，则选择 fallback 中最快返回的结果。
#
#   原作者在两组中使用无污染、响应快的国内 DNS，以缩短解析时间。
#   为避免境外域名解析污染，原作者在 fallback 中仅保留两个 DoT/DoH 服务器。
#
# 2. 原模板的 DNS 配置建议：
#   (1) 为避免解析污染，仅保留 tls:// 或 https:// 服务器；国内域名通常无需这样处理。
#   (2) 若接受解析污染风险以追求速度，可将 nameserver 并入 fallback 并去重。
#
# 3. 原模板对 DNS over HTTPS（DoH）与 DNS over TLS（DoT）的比较：
#   按需选择。原模板称默认使用 DoT，理由是当时国内未封锁或管制。
#   DoH：https:// 开头。原文认为其伪装性更好、几乎不会被封锁，但查询效率和安全性可能略低。
#   DoT：tls:// 开头。原文认为其安全性和查询效率更高，但端口可能被封锁。
#   上述比较为历史观点，技术细节请查阅 DoH/DoT 规范。

