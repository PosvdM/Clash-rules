# 历史参考模板，兼容性与 DNS 说明以原版本为限，见 archive/README.md。
# 配置路径：$HOME/.config/clash/config.yml 或运行目录下的 config.yml。
# HTTP / SOCKS5 共用端口
mixed-port: 7890

# HTTP 代理端口
# port: 7890

# SOCKS5 代理端口
socks-port: 7891

# Linux / macOS redir 端口，取消注释启用
# redir-port: 7892

# 允许局域网共享代理
allow-lan: true

# 仅在 allow-lan: true 时生效
# "*"：绑定所有 IP
# 192.168.122.11：绑定单个 IPv4
# "[aaaa::a8aa:ff:fe09:57d8]"：绑定单个 IPv6
bind-address: "*"
ipv6: true

# 模式：rule（规则）/ global（全局代理）/ direct（全局直连）/ script（脚本）
# mode: rule

# 原模板说明：默认日志级别为 silent（不输出），避免日志过多导致内存溢出。
# 可选 silent / error / warning / info / debug，后者输出更详细；本文件设为 info。
log-level: info

# Clash 的 RESTful API
external-controller: '127.0.0.1:9090'

# 静态面板目录（如 clash-dashboard），使用相对配置目录的路径或绝对路径。
# 面板通过 RESTful API 的 /ui 访问。
# http://127.0.0.1:9090/ui/#/
# external-ui: folder
# yacd 面板：https://github.com/haishanh/yacd
# Razord 面板：http://clash.razord.top/#/proxies
# external-ui: dashboard

# RESTful API 的口令 (可选)
# secret: ""

# 实验性功能
experimental:
  ignore-resolve-fail: true # 忽略 DNS 解析失败，默认 true
  # interface-name: en0 # outbound interface name

# 本地 SOCKS5 / HTTP(S) 服务认证
# authentication:
#  - "user1:pass1"
#  - "user2:pass2"

