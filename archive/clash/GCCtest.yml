dns:
  enable: true # 启用 DNS
  ipv6: true
  use-hosts: true
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip # 模式：redir-host / fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: # fake-ip 排除列表
    - "*"
    - +.lan
    - +.local
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
  default-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true # 默认
    geoip-code: CN
    geosite:
      - gfw
    ipcidr: # 匹配这些网段的结果视为污染
      - 240.0.0.0/4
  nameserver-policy:
  
    rule-set:direct (Domain): https://223.5.5.5/dns-query
    rule-set:SteamDownload (Domain): https://223.5.5.5/dns-query

    geosite:cn,private,apple: https://223.5.5.5/dns-query
    geosite:!cn,gfw: 
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query



hosts:
  'iosapps.itunes.apple.com': hls.itunes.apple.com.mwcname.com
