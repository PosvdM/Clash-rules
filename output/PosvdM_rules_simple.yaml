# Generated from source.yaml by scripts/generate.py; do not edit.
dns:
  enable: true
  ipv6: true
  use-hosts: true
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - geosite:private
  - geosite:connectivity-check
  - time.*.com
  - ntp.*.com
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  fallback:
  - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
  nameserver-policy:
    rule-set:local_direct: https://dns.alidns.com/dns-query
    rule-set:local_SteamDownload: https://dns.alidns.com/dns-query
    geosite:geolocation-!cn,private,apple: https://dns.alidns.com/dns-query
    geosite:!cn,gfw: https://posvdm.cloudflare-gateway.com/dns-query
hosts:
  iosapps.itunes.apple.com: hls.itunes.apple.com.mwcname.com
proxy-groups:
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
- name: 🚀 节点选择
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  type: url-test
  include-all: true
  filter: (?i)^(?!.*(?:(?:\d+(\.\d*)?\s*GB|traffic|expire|premium|github|isp|流量|官网|网址|官址|机场|套餐|应急|时间|重置|剩余|[到过]期|订阅|失联|下载|可用|建议)))[\s\S]*$
- name: 🟢 直连
  type: url-test
  url: http://connect.rom.miui.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - DIRECT
- name: 🛑 广告隐私
  type: select
  proxies:
  - REJECT
  - DIRECT
