# 唯一配置源：规则、策略组、DNS、TUN 全平台共用。output/ 和旧入口由脚本生成。
repository: PosvdM/Clash-rules
branch: main
exclude_remarks: (?i)(?:\d+(\.\d*)?\s*GB|traffic|expire|premium|github|isp|流量|官网|网址|官址|机场|套餐|应急|时间|重置|剩余|[到过]期|订阅|失联|下载|可用)
settings:
  mode: rule
  dns:
    enable: true
    ipv6: true
    use-hosts: true
    prefer-h3: true
    listen: 0.0.0.0:53
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter:
    - geosite:private
    - geosite:connectivity-check
    - time.*.com
    - ntp.*.com
    default-nameserver:
    - https://223.5.5.5/dns-query
    nameserver:
    - https://dns.alidns.com/dns-query
    proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    fallback:
    - https://dns.cloudflare.com/dns-query
    fallback-filter:
      geoip: true
      geoip-code: CN
      geosite:
      - gfw
      ipcidr:
      - 240.0.0.0/4
    nameserver-policy:
      geosite:cn,private,apple: https://dns.alidns.com/dns-query
      geosite:!cn,gfw: https://posvdm.cloudflare-gateway.com/dns-query
  hosts:
    iosapps.itunes.apple.com: hls.itunes.apple.com.mwcname.com
  tun:
    enable: true
    stack: mixed
    auto-route: true
    auto-detect-interface: true
    dns-hijack:
    - any:53
dns_direct_lists:
- list/direct.list
- list/SteamDownload.list
